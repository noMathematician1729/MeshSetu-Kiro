<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0b4f4a"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- shield: safety / protection -->
  <path d="M512 140
           L 760 226
           L 760 486
           C 760 682 651 806 512 884
           C 373 806 264 682 264 486
           L 264 226
           Z"
        fill="url(#shield)" stroke="#e6fffa" stroke-width="10"/>

  <!-- mesh network: nodes + relay lines, offline peer-to-peer relay -->
  <g stroke="#e6fffa" stroke-width="10" stroke-linecap="round" opacity="0.95">
    <line x1="512" y1="430" x2="392" y2="520"/>
    <line x1="512" y1="430" x2="632" y2="520"/>
    <line x1="392" y1="520" x2="452" y2="650"/>
    <line x1="632" y1="520" x2="572" y2="650"/>
    <line x1="452" y1="650" x2="572" y2="650"/>
    <line x1="392" y1="520" x2="632" y2="520"/>
  </g>
  <g fill="#f0fdfa" stroke="#0b4f4a" stroke-width="6">
    <circle cx="392" cy="520" r="26"/>
    <circle cx="632" cy="520" r="26"/>
    <circle cx="452" cy="650" r="26"/>
    <circle cx="572" cy="650" r="26"/>
  </g>

  <!-- center node: SOS / origin device, in red for emergency -->
  <circle cx="512" cy="430" r="46" fill="#ef4444" stroke="#fff1f1" stroke-width="8"/>
  <g fill="#fff1f1">
    <rect x="504" y="404" width="16" height="26" rx="8"/>
    <circle cx="512" cy="446" r="8"/>
  </g>
</svg>
