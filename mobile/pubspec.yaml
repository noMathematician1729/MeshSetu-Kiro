name: meshsetu_mobile
description: MeshSetu mobile app - Developer A's mesh transport logic (Flutter/Android).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.38.4'

dependencies:
  flutter:
    sdk: flutter
  protobuf: ^6.0.0
  cryptography: ^2.7.0
  collection: ^1.19.0
  fixnum: ^1.1.1
  universal_ble: ^2.1.1
  flutter_secure_storage: ^9.2.4
  flutter_foreground_task: ^10.0.0
  permission_handler: ^12.0.1
  device_info_plus: ^12.4.0
  crypto: ^3.0.7
  path_provider: ^2.1.6
  flutter_riverpod: ^2.6.1
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  record: ^7.1.1
  audioplayers: ^6.5.1
  mobile_scanner: ^7.1.2
  qr_flutter: ^4.1.0
  http: ^1.5.0
  uuid: ^4.5.1
  sherpa_onnx: ^1.13.5

dependency_overrides:
  universal_ble:
    path: third_party/universal_ble

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^5.0.0
  drift_dev: any
  build_runner: ^2.9.1

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/models/sherpa-onnx-zipformer-small-en-2023-06-26/encoder-epoch-99-avg-1.int8.onnx
    - assets/models/sherpa-onnx-zipformer-small-en-2023-06-26/decoder-epoch-99-avg-1.onnx
    - assets/models/sherpa-onnx-zipformer-small-en-2023-06-26/joiner-epoch-99-avg-1.int8.onnx
    - assets/models/sherpa-onnx-zipformer-small-en-2023-06-26/tokens.txt
